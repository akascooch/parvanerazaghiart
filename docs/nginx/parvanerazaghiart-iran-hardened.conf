# READY-TO-DEPLOY when origin SSH is reachable.
# Target live file (historical): /etc/nginx/sites-available/parvanerazaghiart.com
#
# Iran resilience notes:
# - Longer proxy timeouts + Connection keepalive to Node upstreams
# - Larger header buffers for fragmented DPI paths
# - proxy_http_version 1.1 with empty Connection for keepalive upstream
# - Keep TLS 1.2+1.3; Cloudflare must disable 0-RTT (see ops checklist)
#
# DO NOT enable until:
#   1) Origin is reachable
#   2) Live file is backed up
#   3) nginx -t passes
#   4) systemctl reload nginx

upstream parvanerazaghiart_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream bendaaz_web {
    server 127.0.0.1:3005;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name parvanerazaghiart.com www.parvanerazaghiart.com _;

    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://parvanerazaghiart.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parvanerazaghiart.com www.parvanerazaghiart.com;

    # Preserve existing Origin CA / Let's Encrypt paths on the host.
    ssl_certificate     /etc/ssl/parvanerazaghiart/origin.crt;
    ssl_certificate_key /etc/ssl/parvanerazaghiart/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # TCP / client resilience (Iran ISP drops & resets)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;

    client_body_buffer_size 128k;
    client_max_body_size 50M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml application/xml+rss;

    location = /bendaaz-app/edge-health {
        access_log off;
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "no-store" always;
        return 200 "OK\n";
    }

    location ^~ /bendaaz-app {
        proxy_pass http://bendaaz_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_buffering off;

        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        client_max_body_size 50M;
    }

    location / {
        proxy_pass http://parvanerazaghiart_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
