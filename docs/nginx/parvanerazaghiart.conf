# Nginx reverse-proxy template for parvanerazaghiart.com
# Linux host. Copy to /etc/nginx/sites-available/ and enable after TLS files exist.
#
# Public browsers MUST reach Next.js (3000), including /api/*.
# Nest (3001) is an internal BFF target only. Proxying /api to Nest would skip
# the Next cookie/session BFF.
#
# Replace certificate paths before enabling HTTPS.

upstream parvanerazaghiart_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream parvanerazaghiart_api {
    server 127.0.0.1:3001;
    keepalive 8;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name parvanerazaghiart.com www.parvanerazaghiart.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://parvanerazaghiart.com$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.parvanerazaghiart.com;

    ssl_certificate     /etc/letsencrypt/live/parvanerazaghiart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parvanerazaghiart.com/privkey.pem;

    return 301 https://parvanerazaghiart.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name parvanerazaghiart.com;

    ssl_certificate     /etc/letsencrypt/live/parvanerazaghiart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parvanerazaghiart.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 16M;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;
    large_client_header_buffers 4 16k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-DNS-Prefetch-Control "off" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2;

    # Requires ngx_http_brotli_filter_module. Comment out if the module is absent.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location /api/health {
        proxy_pass http://parvanerazaghiart_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://parvanerazaghiart_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
